spring.application.name=GAJI
spring.profiles.active=local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/gaji?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# schema.sql / data.sql 자동 실행 (IF NOT EXISTS / INSERT IGNORE 라 재시작해도 안전)
spring.sql.init.mode=always
mybatis.configuration.map-underscore-to-camel-case=true
